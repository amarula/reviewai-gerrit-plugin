<!doctype html>
<meta charset="utf-8">
<style>
  body { margin: 0; font: 13px Arial; color: #222;
    --primary-text-color: #222; --dialog-background-color: #fff; --border-color: #ccc; }
  gr-endpoint-decorator { display: block; height: 100vh; }
  gr-endpoint-decorator > :not(gr-endpoint-param) { height: 100%; }
</style>
<gr-endpoint-decorator><chat-panel></chat-panel></gr-endpoint-decorator>
<script>
  // Exercise the Gerrit 3.15 shadow-DOM/menu/chip event contract without a live Gerrit server.
  window.nativeTextDialogOpenCount = 0;
  customElements.define('md-menu', class extends HTMLElement {
    set open(value) { this.hidden = !value; }
    get open() { return !this.hidden; }
  });
  customElements.define('md-filter-chip', class extends HTMLElement {
    connectedCallback() {
      if (this.shadowRoot) return;
      const root = this.attachShadow({mode: 'open'});
      // Relevant Material 2.5 chip layout: a shrinking primary action and a trailing remove action.
      root.innerHTML = `
        <style>
          :host { display: inline-flex; }
          .container { display: flex; width: 100%; box-sizing: border-box; }
          .action { display: flex; align-items: center; border: 0; padding: 2px 6px; background: none; }
          .primary.action { min-width: 0; }
          .label { display: flex; overflow: hidden; }
          .label-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
          .leading { width: 12px; flex-shrink: 0; margin-right: 4px; }
          .trailing { min-width: 24px; }
        </style>
        <div class="container">
          <button class="primary action"><span class="leading">▤</span><span class="label"><span class="label-text"><slot></slot></span></span></button>
          <button class="trailing action" aria-label="Remove context">×</button>
        </div>`;
      root.querySelector('.trailing').addEventListener('click', () => this.dispatchEvent(
        new CustomEvent('remove', {bubbles: true, composed: true})
      ));
    }
  });
  customElements.define('context-chip', class extends HTMLElement {
    connectedCallback() {
      if (this.shadowRoot) return;
      const root = this.attachShadow({mode: 'open'});
      root.innerHTML = `
        <style>
          :host { overflow: hidden; max-width: 300px; }
          md-filter-chip { overflow: hidden; border: 1px solid #ccc; border-radius: 8px; }
          .context-chip-container { display: flex; flex-wrap: nowrap; align-items: center; }
          .context-chip-title { padding-top: 2px; }
        </style>
        <md-filter-chip class="context-chip"><div class="context-chip-container"><span class="context-chip-title"></span></div></md-filter-chip>`;
      root.querySelector('.context-chip-title').textContent = this.contextItem.title;
      root.querySelector('md-filter-chip').addEventListener('remove', () => this.dispatchEvent(
        new CustomEvent('remove-context-chip', {bubbles: true, composed: true})
      ));
    }
  });
  customElements.define('context-input-chip', class extends HTMLElement {
    constructor() {
      super();
      const root = this.attachShadow({mode: 'open'});
      root.innerHTML = `
        <style>
          :host { position: relative; display: inline-block; }
          button { border: 1px solid #bbb; border-radius: 12px; background: white; padding: 4px 10px; }
          md-menu { position: absolute; bottom: 30px; left: 0; background: white;
            border: 1px solid #ccc; border-radius: 6px; min-width: 150px; box-shadow: 0 3px 10px #0002; }
          md-menu-item { display: block; padding: 8px; cursor: pointer; }
          md-menu-item:focus { background: #eef; }
          [hidden] { display: none; }
        </style>
        <button id="addContextChip" aria-label="Add Context">＋ Add Context</button>
        <md-menu id="contextMenu" hidden></md-menu>
        <input id="nativeLinkInput" hidden aria-label="Add external link">`;
      root.querySelector('#addContextChip').addEventListener('click', () => {
        root.querySelector('#contextMenu').open = true;
      });
    }

    set types(types) {
      this.contextMenuItems = types;
      const menu = this.shadowRoot.querySelector('#contextMenu');
      menu.replaceChildren();
      types.forEach(type => {
        const item = document.createElement('md-menu-item');
        item.setAttribute('role', 'menuitem');
        item.tabIndex = 0;
        const label = document.createElement('span');
        label.slot = 'headline';
        label.textContent = type.name;
        item.append(label);
        item.addEventListener('keydown', event => {
          if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault();
            item.click();
          }
        });
        item.addEventListener('click', () => {
          window.nativeTextDialogOpenCount++;
          this.shadowRoot.querySelector('#nativeLinkInput').hidden = false;
          menu.open = false;
        });
        menu.append(item);
      });
    }
  });
  customElements.define('prompt-box', class extends HTMLElement {
    constructor() {
      super();
      this.items = [];
      const root = this.attachShadow({mode: 'open'});
      root.innerHTML = `
        <style>:host { display: block; border: 1px solid #ddd; border-radius: 12px; padding: 12px; }
          textarea { width: 100%; box-sizing: border-box; resize: none; border: none; padding: 6px; }
          #attachments { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }</style>
        <textarea aria-label="Chat prompt" placeholder="Enter a prompt here…"></textarea>
        <div><context-input-chip></context-input-chip><span>This Change</span></div>
        <span id="attachments"></span>`;
      root.querySelector('context-input-chip').addEventListener('context-item-added', event => {
        this.items = [...this.items, event.detail];
        this.renderChips();
      });
    }

    set types(value) { this.shadowRoot.querySelector('context-input-chip').types = value; }

    renderChips() {
      const container = this.shadowRoot.querySelector('#attachments');
      container.replaceChildren();
      this.items.forEach(item => {
        const chip = document.createElement('context-chip');
        chip.className = 'external-context';
        chip.contextItem = item;
        chip.addEventListener('remove-context-chip', () => {
          this.items = this.items.filter(candidate => candidate !== item);
          this.renderChips();
        });
        container.append(chip);
      });
    }
  });
  customElements.define('chat-panel', class extends HTMLElement {
    constructor() {
      super();
      this.attachShadow({mode: 'open'}).innerHTML = `
        <style>:host { display: flex; flex-direction: column; height: 100%; padding: 12px;
          box-sizing: border-box; border: 1px solid #ddd; } .conversation { flex: 1; }</style>
        <strong>Agent Chat</strong><div class="conversation"></div><prompt-box></prompt-box>`;
    }
  });
</script>
